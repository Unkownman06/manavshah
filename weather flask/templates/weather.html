<!DOCTYPE html>
<html>

<head>

    <title>Weather App</title>

    <style>

        body {
            font-family: Arial;
            background-color: lightblue;
        }

        .box {

            width: 300px;
            margin: auto;
            margin-top: 100px;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        input {

            width: 100%;
            padding: 8px;
        }

        button {

            width: 100%;
            padding: 10px;
            background-color: darkblue;
            color: white;
            border: none;
        }

    </style>

</head>

<body>

    <div class="box">

        <h2>Weather App</h2>

        <form method="POST">

            <input
                type="text"
                name="city"
                placeholder="Enter City"
                required>

            <br><br>

            <button type="submit">

                Check Weather

            </button>

        </form>

        <h3>{{result}}</h3>

    </div>

</body>

</html>

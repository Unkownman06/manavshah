<!DOCTYPE html>
<html>

<head>

    <title>BMI Calculator</title>

    <style>

        body {

            font-family: Arial;
            background-color: lightblue;
        }

        .box {

            width: 300px;
            margin: auto;
            margin-top: 100px;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        input {

            width: 100%;
            padding: 8px;
        }

        button {

            width: 100%;
            padding: 10px;
            background-color: darkblue;
            color: white;
            border: none;
        }

    </style>

</head>

<body>

    <div class="box">

        <h2>BMI Calculator</h2>

        <form method="POST">

            <label>Weight (kg)</label>

            <br><br>

            <input
                type="number"
                step="any"
                name="weight"
                required>

            <br><br>

            <label>Height (m)</label>

            <br><br>

            <input
                type="number"
                step="any"
                name="height"
                required>

            <br><br>

            <button type="submit">

                Calculate BMI

            </button>

        </form>

        <h3>{{result}}</h3>

    </div>

</body>

</html>
